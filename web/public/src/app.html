<!doctype html>
<html lang="en" data-palette="baoopn" data-theme="light" data-mode="system">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="What Bao is listening to on Spotify right now, live, plus the last few tracks played."
		/>
		<meta name="theme-color" content="#0b0537" />
		<link rel="canonical" href="https://listening.baoopn.com/" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="baoopn listening" />
		<meta property="og:url" content="https://listening.baoopn.com/" />
		<meta property="og:title" content="What Bao is listening to" />
		<meta
			property="og:description"
			content="Live Spotify now playing and recently played tracks."
		/>
		<meta property="og:image" content="https://listening.baoopn.com/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="baoopn listening: what Bao is listening to" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://listening.baoopn.com/og-image.png" />
		<meta name="twitter:title" content="What Bao is listening to" />
		<meta
			name="twitter:description"
			content="Live Spotify now playing and recently played tracks."
		/>
		<script>
			// Applies the saved palette + resolved light/dark theme before first paint.
			// Keep in sync with src/lib/theme.svelte.ts.
			(function () {
				var d = document.documentElement;
				var palettes = ['baoopn', 'lavender', 'mint', 'peach', 'sky', 'rose'];
				var palette = 'baoopn';
				var mode = 'system';
				try {
					var p = localStorage.getItem('st-public:palette');
					var m = localStorage.getItem('st-public:mode');
					if (p && palettes.indexOf(p) !== -1) palette = p;
					if (m === 'light' || m === 'dark' || m === 'system') mode = m;
				} catch (e) {}
				var dark =
					mode === 'dark' ||
					(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				d.setAttribute('data-palette', palette);
				d.setAttribute('data-theme', dark ? 'dark' : 'light');
				d.setAttribute('data-mode', mode);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
