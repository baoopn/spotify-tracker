name: Release & deploy

# On every push to main: run CI, build and push the image to GHCR (used by
# docker-compose.prod.yml on plain VPS hosts), then trigger the Coolify
# resource on sr2, which builds the same commit from the repo and deploys it.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   secrets.COOLIFY_TOKEN          Coolify API token with deploy permission
#   vars.COOLIFY_URL               e.g. https://coolify.baoopn.com
#   vars.COOLIFY_RESOURCE_UUID     UUID of the spotify-tracker Coolify application
# The "production" environment can add required reviewers if desired.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to Coolify (sr2)
    needs: image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Trigger deployment
        id: deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS "$COOLIFY_URL/api/v1/deploy?uuid=$UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -A github-actions)
          echo "$resp"
          echo "deployment_uuid=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid')" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(curl -fsS "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -A github-actions | jq -r '.status')
            echo "[$i] status=$status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for deployment"; exit 1
