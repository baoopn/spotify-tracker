name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated code is up to date
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf lint
          buf generate
          git diff --exit-code -- gen/

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

  web:
    name: Frontend (${{ matrix.app }}) — check, lint, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, public]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/${{ matrix.app }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build

  public-safety:
    name: Public-safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No machine paths, keys, deployment details or runtime state in tracked files
        run: sh scripts/check-public.sh

  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          API_DOMAIN=example.com POSTGRES_PASSWORD=x REDIS_PASSWORD=x INTERNAL_API_TOKEN=x \
            CORS_ALLOWED_ORIGINS=https://example.com \
            docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.coolify.yml config -q

  docker:
    name: Docker build (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
