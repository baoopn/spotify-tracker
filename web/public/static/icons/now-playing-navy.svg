<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="now playing">
  <title>now playing</title>
  <g fill="none" stroke="#0b0537" stroke-width="16" stroke-linecap="round">
    <line x1="55" y1="105" x2="55" y2="150"><animate attributeName="y1" values="105;70;120;105" dur="1.1s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/></line>
    <line x1="85" y1="70" x2="85" y2="150"><animate attributeName="y1" values="70;50;100;70" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/></line>
    <line x1="115" y1="90" x2="115" y2="150"><animate attributeName="y1" values="90;90;60;90" dur="1.3s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/></line>
    <line x1="145" y1="115" x2="145" y2="150"><animate attributeName="y1" values="115;110;80;115" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/></line>
  </g>
</svg>
