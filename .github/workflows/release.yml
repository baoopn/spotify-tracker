name: Release & deploy

# On every push to main: run CI, build and push the images to GHCR (used by
# docker-compose.prod.yml on plain VPS hosts: the app and the -backup
# sidecar), then trigger the Coolify
# resource, which builds the same commit from the repo and deploys it.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   secrets.COOLIFY_TOKEN          Coolify API token with deploy permission
#   vars.COOLIFY_URL               e.g. https://coolify.example.com
#   vars.COOLIFY_RESOURCE_UUID     UUID of the spotify-tracker Coolify application
# The "production" environment can add required reviewers if desired.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Artifact attestations are unavailable for private repos on personal
      # accounts; the image still carries buildx provenance + SBOM.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Off-site backup sidecar (deploy/backup), same tags as the app image. The
  # deploy does not wait for it: Coolify builds the sidecar from the repo.
  backup-image:
    name: Build & push backup image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}-backup
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
          provenance: true
          sbom: true

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}-backup
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to Coolify
    needs: image
    # Skipped until the Coolify resource is wired up (vars.COOLIFY_RESOURCE_UUID).
    if: vars.COOLIFY_RESOURCE_UUID != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Policy: changes reach production only through merged pull requests.
      # (Branch rulesets need GitHub Pro on private personal repos, so this
      # gate enforces it at deploy time: direct pushes are built and tested
      # but never deployed. Manual runs and v* tags are allowed.)
      - name: Require a merged pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [ "$prs" -eq 0 ]; then
            echo "::error::Commit ${{ github.sha }} was pushed to main without a merged pull request. Not deploying. Open a PR instead."
            exit 1
          fi
          echo "Commit came from $prs merged pull request(s)."

      # Coolify v4 /deploy builds the branch head, not a given commit. Deploy
      # only while main still points at the commit this run tested; if it
      # moved, the newer run in the same concurrency group deploys it. A v*
      # tag deploys only when it tags main's head: Coolify would build main,
      # not the tagged commit.
      - name: Check main still points at this commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" != "${{ github.sha }}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::notice::Tag ${{ github.ref_name }} points at ${{ github.sha }}, but main is at $head; Coolify builds main, so this tag is not deployed."
            else
              echo "::notice::main moved to $head since ${{ github.sha }}; skipping this deploy, the newer run deploys."
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deployment
        id: deploy
        if: steps.head.outputs.skip != 'true'
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
        run: |
          set -euo pipefail
          # Coolify v4 requires POST for /deploy.
          resp=$(curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" -A github-actions \
            --data "{\"uuid\":\"$UUID\",\"force\":false}")
          echo "$resp"
          echo "deployment_uuid=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid')" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        if: steps.head.outputs.skip != 'true'
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          # First builds compile both frontends + Go on the server: allow 20 min.
          for i in $(seq 1 120); do
            resp=$(curl -fsS "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -A github-actions | jq -c 'if type == "array" then .[0] else . end')
            status=$(echo "$resp" | jq -r '.status')
            echo "[$i] status=$status"
            case "$status" in
              finished)
                # Coolify records the commit it built (ApplicationDeploymentQueue.commit).
                # It may be "HEAD" or empty when it did not resolve one.
                built=$(echo "$resp" | jq -r '.commit // ""')
                if [[ "$built" =~ ^[0-9a-f]{40}$ ]]; then
                  if [ "$built" != "${{ github.sha }}" ]; then
                    echo "::error::Coolify built $built, not the tested commit ${{ github.sha }}. Production may run untested code; redeploy the tested commit or check the Coolify resource's branch."
                    exit 1
                  fi
                  echo "Coolify built the tested commit."
                else
                  echo "::notice::Coolify did not report the commit it built ('$built')."
                fi
                exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for deployment"; exit 1
