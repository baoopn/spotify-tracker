# Local development stack.
#
#   cp .env.example .env   # fill in Spotify + Soundcharts credentials
#   docker compose up --build
#
# API + embedded frontends: http://127.0.0.1:8080 (public page), /admin, /api/v1
# Frontend dev servers (hot reload, proxy to the api container):
#           admin  http://127.0.0.1:5173/admin   public  http://127.0.0.1:5174
# E2E tests: docker compose --profile e2e run --rm e2e
# gRPC:     localhost:9000 (reflection enabled in development)
# Postgres: localhost:5432   Redis: localhost:6379
#
# To run a service from source instead (e.g. `go run ./cmd/api`), start only the
# dependencies with `docker compose up -d postgres redis` and use `make run-api`.

name: spotify-tracker-dev

x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
    args:
      VERSION: dev
  image: spotify-tracker:dev
  env_file: .env
  restart: unless-stopped

x-app-env: &app-env
  APP_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/0
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-change-me}
  TRACKER_GRPC_ADDR: api:9000

x-web: &web
  image: node:22-alpine
  restart: unless-stopped
  # pnpm via corepack; install is a no-op when node_modules is current. The
  # store lives outside the bind-mounted sources (never in the repo).
  command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile --store-dir /pnpm-store && exec pnpm exec vite dev --host 0.0.0.0 --port 5173 --strictPort"]
  depends_on:
    api: { condition: service_healthy }

x-web-env: &web-env
  CI: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Poll sources for hot reload (host bind mounts don't deliver file events).
  VITE_WATCH_POLL: "1000"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-spotify_tracker}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-devredis}
      --maxmemory 128mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-devredis}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}

  api:
    <<: *app
    command: ["/usr/local/bin/api"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@postgres:5432/${POSTGRES_DB:-spotify_tracker}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      TRUSTED_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  poller:
    <<: *app
    command: ["/usr/local/bin/poller"]
    environment:
      <<: *app-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/poller", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  enricher:
    <<: *app
    command: ["/usr/local/bin/enricher"]
    environment:
      <<: *app-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/enricher", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Vite dev servers for both frontends, with hot reload. Sources are bind
  # mounted; node_modules live in volumes because the host's (Windows/macOS)
  # native binaries don't run in Linux containers.
  web-admin:
    <<: *web
    working_dir: /app
    volumes:
      - ./web/admin:/app
      - web-admin-node-modules:/app/node_modules
    environment:
      <<: *web-env
      ADMIN_API_TARGET: http://api:8080
      VITE_ALLOWED_HOSTS: web-admin
    ports:
      - "127.0.0.1:${WEB_ADMIN_HOST_PORT:-5173}:5173"

  web-public:
    <<: *web
    working_dir: /app
    volumes:
      - ./web/public:/app
      - web-public-node-modules:/app/node_modules
    environment:
      <<: *web-env
      PUBLIC_API_TARGET: http://api:8080
      VITE_ALLOWED_HOSTS: web-public
    ports:
      - "127.0.0.1:${WEB_PUBLIC_HOST_PORT:-5174}:5173"

  # End-to-end tests (Playwright) against the running stack:
  #   docker compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    environment:
      CI: "true"
      E2E_API_URL: http://api:8080
      E2E_ADMIN_DEV_URL: http://web-admin:5173
      E2E_PUBLIC_DEV_URL: http://web-public:5173
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    depends_on:
      api: { condition: service_healthy }

  # One-off Directus → Postgres import:
  #   docker compose --profile tools run --rm importer
  importer:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command: ["/usr/local/bin/importer"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@postgres:5432/${POSTGRES_DB:-spotify_tracker}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  web-admin-node-modules:
  web-public-node-modules:
  e2e-node-modules:
