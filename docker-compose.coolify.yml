# Coolify deployment ("Docker Compose" build pack, Git source).
#
# Coolify builds the image from the repository on the target server: the
# "api" service builds it once, "poller" and "enricher" reuse the same local
# image, so no container-registry credentials are needed on the server.
#
# In Coolify: New Resource → Public/Private Repository → Build Pack "Docker
# Compose" → Docker Compose Location "/docker-compose.coolify.yml".
#
# Coolify generates every SERVICE_* value below on first deploy. Set these in
# the resource's Environment Variables tab:
#   SECRETS_KEY (openssl rand -hex 32; keep it stable — it encrypts stored tokens)
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET (+ optional SPOTIFY_REFRESH_TOKEN /
#     SPOTIFY_AUTHORIZED_AT seed; otherwise authorize from the dashboard)
#   SOUNDCHARTS_APP_ID, SOUNDCHARTS_TOKEN, CORS_ALLOWED_ORIGINS
#   CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY, ADMIN_ALLOWED_EMAILS (admin dashboard)
#   EMAIL_SMTP_* / EMAIL_FROM / ALERT_EMAIL_TO (seed for alert emails; editable
#     in the dashboard afterwards)
#   BACKUP_AGE_RECIPIENT, BACKUP_S3_* (encrypted off-site backups, see
#     docs/backup.md; the backup service idles until they are set)
# Register <api domain>/admin/api/spotify/callback as a Redirect URI in the
# Spotify Developer Dashboard.
# Set the API domain on the "api" service (e.g. https://spotify-api.example.com);
# Coolify's Traefik proxy routes it to port 8080 and handles TLS.
#
# Do not add custom networks or published ports: Coolify manages networking.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-spotify_tracker}
    volumes:
      - spotify-tracker-postgres-data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: >
      redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}
      --maxmemory 128mb --maxmemory-policy volatile-lru
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    volumes:
      - spotify-tracker-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        # Coolify provides SOURCE_COMMIT for builds ("Include Source Commit
        # in Build"); shown as the app version in the dashboard.
        VERSION: ${SOURCE_COMMIT:-coolify}
    image: spotify-tracker-app:latest
    command: ["/usr/local/bin/api"]
    environment:
      - SERVICE_FQDN_API_8080
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-spotify_tracker}?sslmode=disable
      - REDIS_URL=redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
      - INTERNAL_API_TOKEN=${SERVICE_PASSWORD_64_INTERNALAPI}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CACHE_TTL=${CACHE_TTL:-5m}
      - PUBLIC_SHOW_PRIVATE_PLAYLISTS=${PUBLIC_SHOW_PRIVATE_PLAYLISTS:-false}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-240}
      - TOP_PLAYLISTS_PERIODS=${TOP_PLAYLISTS_PERIODS:-week,month,year}
      - TOP_PLAYLISTS_TIME_ZONE=${TOP_PLAYLISTS_TIME_ZONE:-UTC}
      - TOP_PLAYLISTS_LIVE=${TOP_PLAYLISTS_LIVE:-week}
      - TOP_PLAYLISTS_LIVE_REFRESH=${TOP_PLAYLISTS_LIVE_REFRESH:-1h}
      - TOP_PLAYLISTS_KEEP=${TOP_PLAYLISTS_KEEP:-3}
      - TOP_PLAYLISTS_VERIFY=${TOP_PLAYLISTS_VERIFY:-1h}
      - TOP_PLAYLISTS_OWNER=${TOP_PLAYLISTS_OWNER:-}
      - PUBLIC_URL=${SERVICE_URL_API}
      - SECRETS_KEY=${SECRETS_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN:-}
      - SPOTIFY_AUTHORIZED_AT=${SPOTIFY_AUTHORIZED_AT:-}
      - SPOTIFY_TOKEN_LIFETIME_DAYS=${SPOTIFY_TOKEN_LIFETIME_DAYS:-180}
      - SPOTIFY_OWNER_ID=${SPOTIFY_OWNER_ID:-}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - EMAIL_LOGO_URL=${EMAIL_LOGO_URL:-}
      # Brand files from the baoopn brand API. Coolify may treat an empty value
      # as unset, so to always use the static copies set BRAND_API_URL=off
      # (any non-https value disables it, with an error in the log).
      - BRAND_API_URL=${BRAND_API_URL:-https://baoopn.com/api/v1/brand/listening}
      - BRAND_REFRESH=${BRAND_REFRESH:-60s}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - ADMIN_ALLOWED_EMAILS=${ADMIN_ALLOWED_EMAILS:-}
      - ADMIN_ALLOWED_USER_IDS=${ADMIN_ALLOWED_USER_IDS:-}
      - ADMIN_ROLE=${ADMIN_ROLE:-admin}
      # One-off legacy import (enriched features only): set these, run
      # `/usr/local/bin/importer -dry-run` then `/usr/local/bin/importer` in the
      # api container terminal, then remove them again.
      - DIRECTUS_URL=${DIRECTUS_URL:-}
      - DIRECTUS_TOKEN=${DIRECTUS_TOKEN:-}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  poller:
    image: spotify-tracker-app:latest
    command: ["/usr/local/bin/poller"]
    environment:
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - REDIS_URL=redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
      - INTERNAL_API_TOKEN=${SERVICE_PASSWORD_64_INTERNALAPI}
      - TRACKER_GRPC_ADDR=api:9000
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/poller", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  enricher:
    image: spotify-tracker-app:latest
    command: ["/usr/local/bin/enricher"]
    environment:
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - REDIS_URL=redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
      - INTERNAL_API_TOKEN=${SERVICE_PASSWORD_64_INTERNALAPI}
      - TRACKER_GRPC_ADDR=api:9000
      - ENRICH_INTERVAL_MS=${ENRICH_INTERVAL_MS:-60000}
      - SOUNDCHARTS_APP_ID=${SOUNDCHARTS_APP_ID}
      - SOUNDCHARTS_TOKEN=${SOUNDCHARTS_TOKEN}
      - SOUNDCHARTS_RPS=${SOUNDCHARTS_RPS:-10}
      - SOUNDCHARTS_BURST=${SOUNDCHARTS_BURST:-5}
      - ENRICH_CONCURRENCY=${ENRICH_CONCURRENCY:-5}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/enricher", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Encrypted off-site Postgres backups (docs/backup.md). Idles with a WARN
  # until BACKUP_AGE_RECIPIENT and a destination are set.
  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
      args:
        VERSION: ${SOURCE_COMMIT:-coolify}
    image: spotify-tracker-backup:latest
    command: ["run"]
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${SERVICE_USER_POSTGRES}
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=${POSTGRES_DB:-spotify_tracker}
      - BACKUP_AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:-}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-auto}
      - BACKUP_S3_PROVIDER=${BACKUP_S3_PROVIDER:-Cloudflare}
      - BACKUP_REMOTE=${BACKUP_REMOTE:-}
      - BACKUP_PREFIX=${BACKUP_PREFIX:-spotify-tracker}
      - BACKUP_TIME=${BACKUP_TIME:-03:00}
      - BACKUP_ON_START=${BACKUP_ON_START:-false}
      - BACKUP_RETRY_MINUTES=${BACKUP_RETRY_MINUTES:-30}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
      - BACKUP_KEEP_MIN=${BACKUP_KEEP_MIN:-7}
      - BACKUP_MAX_AGE_HOURS=${BACKUP_MAX_AGE_HOURS:-26}
      - BACKUP_PING_URL=${BACKUP_PING_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  spotify-tracker-postgres-data:
  spotify-tracker-redis-data:
